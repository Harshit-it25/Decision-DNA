<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision DNA | AI Security Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'IBM Plex Sans', 'Inter', sans-serif;
      background-color: #F8F9FA;
      color: #111827;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    /* Custom scrollbar for premium dashboard feel */
    .terminal-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .terminal-scroll::-webkit-scrollbar-track { background: transparent; }
    .terminal-scroll::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
    .terminal-scroll::-webkit-scrollbar-thumb:hover { background: #A9A9A9; }
    
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
